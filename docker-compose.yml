services:
  mysql:
    image: mysql:8.0
    container_name: habit-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-habit_tracker}
      MYSQL_USER: ${DB_USER:-habit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-habit_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - habit-net

  backend:
    build:
      context: ./backend
    container_name: habit-tracker-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-habit_user}
      DB_PASSWORD: ${DB_PASSWORD:-habit_pass}
      DB_NAME: ${DB_NAME:-habit_tracker}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - habit-net

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing URL of the backend API (baked into the client bundle at build time).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: habit-tracker-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "8080:3000"
    depends_on:
      - backend
    networks:
      - habit-net

networks:
  habit-net:
    driver: bridge

volumes:
  mysql_data:
